[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2f-ood"
version = "0.1.0"
description = "Atom-aligned graph and SMILES fusion for molecular OOD prediction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23.5,<2",
  "requests>=2.28",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "torch>=1.12",
  "rdkit>=2023.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
a2f-train = "a2f_ood.train:main"
a2f-evaluate = "a2f_ood.evaluate:main"
a2f-predict = "a2f_ood.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
